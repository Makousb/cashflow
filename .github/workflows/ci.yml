name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On a timer as well as on push, because not everything here fails reliably.
  # The page suite's setup has failed once in a way nothing has managed to
  # provoke since — not fifteen reruns, not any number of runs against a fresh
  # database locally — and a fault that rare is caught by waiting somewhere that
  # costs nothing, not by being chased. GitHub mails whoever last touched this
  # schedule when a scheduled run fails, which is the point of it.
  #
  # Twice a day, twelve hours apart, so a fault that only shows at some hours is
  # not permanently missed by a timer that only ever sees one of them. The pair
  # also lands either side of the date line the timezone legs straddle: at 02:17
  # the Niue leg's calendar is a day behind UTC's, and at 14:17 it is Kiritimati
  # that is a day ahead. So each of the two legs spends one run a day on a date
  # UTC does not agree with, which is what those legs are there for.
  #
  # Seventeen past, because scheduled runs queue behind everything that asked
  # for the top of an hour.
  #
  # A scheduled workflow is disabled after 60 days without a commit to the
  # repository, so this stops on its own if the project goes quiet.
  schedule:
    - cron: "17 2 * * *"
    - cron: "17 14 * * *"

jobs:
  test:
    name: Node app (${{ matrix.timezone }})
    runs-on: ubuntu-latest

    # Dates built here are compared against CURRENT_DATE, which Postgres reads
    # in its own timezone. A runner on UTC is the one setting where those two
    # can never disagree, so a date built the wrong way round passes CI and
    # fails only on a machine east of UTC, after midnight, and looks like a
    # flake when it does. That is how the sales summary stayed broken.
    #
    # UTC stays, because that is what production runs on. The other two are the
    # extremes either side of it, neither observing DST, and they are a pair on
    # purpose: a zone at +14 has a different calendar from UTC for the last
    # fourteen hours of the UTC day, one at -11 for the first eleven, so
    # whenever CI runs at least one leg is on a date UTC does not agree with.
    # A date built the wrong way round now fails on every run, not on some.
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Pacific/Kiritimati, Pacific/Niue]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cashflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cashflow_test
      DB_SSL: "false"
      TZ: ${{ matrix.timezone }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches the syntax errors that otherwise only show up at boot or on
      # the page: the schema is one long template literal, and views are
      # compiled at render time.
      - name: Parse every source file
        run: npm run check

      # Both clocks or neither. Moving the runner alone would only prove they
      # can disagree — every date test would fail and none of it would mean
      # anything. Setting it on the database rather than the container leaves
      # nothing to the image's own timezone handling.
      - name: Put the database on the runner's clock
        run: |
          psql "$DATABASE_URL" -c "ALTER DATABASE cashflow_test SET timezone TO '$TZ'"
          echo "runner  $(date +'%Y-%m-%d %H:%M %Z')  (UTC $(date -u +'%Y-%m-%d %H:%M'))"
          echo "database $(psql "$DATABASE_URL" -tAc 'SELECT CURRENT_DATE') $(psql "$DATABASE_URL" -tAc 'SHOW timezone')"

      - name: Tests
        run: npm test

      # The suite runs against a database the tests have already migrated, so
      # seed a brand-new one as well: a first install is its own code path, and
      # it is where the last two schema bugs were hiding.
      - name: Install from scratch
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE cashflow_fresh'
          psql "$DATABASE_URL" -c "ALTER DATABASE cashflow_fresh SET timezone TO '$TZ'"
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/cashflow_fresh npm run seed

  analytics:
    name: Analytics service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - run: pip install -r analytics/requirements.txt

      - name: Import the service
        working-directory: analytics
        run: python -c "import app; print('analytics service imports cleanly')"

      # Standard library only, as on the Node side — nothing to install for it.
      - name: Tests
        working-directory: analytics
        run: python -m unittest -v
