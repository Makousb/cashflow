name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node app (${{ matrix.timezone }})
    runs-on: ubuntu-latest

    # Dates built here are compared against CURRENT_DATE, which Postgres reads
    # in its own timezone. A runner on UTC is the one setting where those two
    # can never disagree, so a date built the wrong way round passes CI and
    # fails only on a machine east of UTC, after midnight, and looks like a
    # flake when it does. That is how the sales summary stayed broken. One leg
    # keeps the UTC signal, since that is what production runs on; the other
    # moves off it far enough that the two calendars differ for most of the day.
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Pacific/Kiritimati]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cashflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cashflow_test
      DB_SSL: "false"
      TZ: ${{ matrix.timezone }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches the syntax errors that otherwise only show up at boot or on
      # the page: the schema is one long template literal, and views are
      # compiled at render time.
      - name: Parse every source file
        run: npm run check

      # Both clocks or neither. Moving the runner alone would only prove they
      # can disagree — every date test would fail and none of it would mean
      # anything. Setting it on the database rather than the container leaves
      # nothing to the image's own timezone handling.
      - name: Put the database on the runner's clock
        run: |
          psql "$DATABASE_URL" -c "ALTER DATABASE cashflow_test SET timezone TO '$TZ'"
          echo "runner  $(date +'%Y-%m-%d %H:%M %Z')  (UTC $(date -u +'%Y-%m-%d %H:%M'))"
          echo "database $(psql "$DATABASE_URL" -tAc 'SELECT CURRENT_DATE') $(psql "$DATABASE_URL" -tAc 'SHOW timezone')"

      - name: Tests
        run: npm test

      # The suite runs against a database the tests have already migrated, so
      # seed a brand-new one as well: a first install is its own code path, and
      # it is where the last two schema bugs were hiding.
      - name: Install from scratch
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE cashflow_fresh'
          psql "$DATABASE_URL" -c "ALTER DATABASE cashflow_fresh SET timezone TO '$TZ'"
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/cashflow_fresh npm run seed

  analytics:
    name: Analytics service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - run: pip install -r analytics/requirements.txt

      - name: Import the service
        working-directory: analytics
        run: python -c "import app; print('analytics service imports cleanly')"
